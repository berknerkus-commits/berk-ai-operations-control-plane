name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ops
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: ops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ops -d ops"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m compileall -q app tests scripts
      - name: PostgreSQL migration and API smoke test
        env:
          DATABASE_URL: postgresql://ops:ci-password@127.0.0.1:5432/ops
          WEBHOOK_SECRET: ci-webhook-secret
          OPERATOR_TOKEN: ci-operator-token
          ENVIRONMENT: production
        run: |
          python scripts/migrate.py
          timeout 20s python -m uvicorn app:api --host 127.0.0.1 --port 8000 >/tmp/ai-ops-api.log 2>&1 &
          for i in $(seq 1 20); do curl --fail http://127.0.0.1:8000/health && curl --fail http://127.0.0.1:8000/ready && break || sleep 1; done
          kill $(pgrep -f 'uvicorn app:api' | head -1) || true
      - run: docker build -t ai-ops-control-plane:ci .
      - run: WEBHOOK_SECRET=ci-webhook-secret OPERATOR_TOKEN=ci-operator-token POSTGRES_PASSWORD=ci-password docker compose -f infra/docker-compose.yml config
