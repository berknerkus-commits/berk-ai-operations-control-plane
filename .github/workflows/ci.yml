name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ops
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: ops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ops -d ops"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m compileall -q app tests scripts
      - name: PostgreSQL migration and API smoke test
        env:
          DATABASE_URL: postgresql://ops:ci-password@127.0.0.1:5432/ops
          WEBHOOK_SECRET: ci-webhook-secret
          OPERATOR_TOKEN: ci-operator-token
          ENVIRONMENT: production
        run: |
          python scripts/migrate.py
          timeout 20s python -m uvicorn app:api --host 127.0.0.1 --port 8000 >/tmp/ai-ops-api.log 2>&1 &
          for i in $(seq 1 20); do curl --fail http://127.0.0.1:8000/health && curl --fail http://127.0.0.1:8000/ready && break || sleep 1; done
          kill $(pgrep -f 'uvicorn app:api' | head -1) || true
      - run: docker build -t ai-ops-control-plane:ci .
      - name: Real n8n runtime integration smoke test
        run: |
          docker run -d --name n8n-ci -p 5679:5678 \
            -e N8N_SECURE_COOKIE=false -e N8N_USER_MANAGEMENT_DISABLED=true \
            -e N8N_DIAGNOSTICS_ENABLED=false -e N8N_PERSONALIZATION_ENABLED=false \
            --add-host=host.docker.internal:host-gateway \
            -v "$GITHUB_WORKSPACE/n8n:/workflows:ro" n8nio/n8n:1.107.3
          for i in $(seq 1 60); do curl --fail http://127.0.0.1:5679/healthz && break || sleep 2; done
          docker exec n8n-ci n8n import:workflow --input=/workflows/ci-proof.json
          curl --fail -X POST http://127.0.0.1:5679/webhook/ci-proof | tee /tmp/n8n-proof.json
          python -c 'import json; d=json.load(open("/tmp/n8n-proof.json")); assert d["backend"]["status"] == "ok"'
          docker rm -f n8n-ci
      - run: WEBHOOK_SECRET=*** OPERATOR_TOKEN=*** POSTGRES_PASSWORD=*** docker compose -f infra/docker-compose.yml config
