services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://ops:${POSTGRES_PASSWORD}@postgres:5432/ops
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set a local secret}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?set an operator token}
      ENVIRONMENT: production
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a local password}
      POSTGRES_DB: ops
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ops-data:/var/lib/postgresql/data
  n8n:
    image: n8nio/n8n:1.107.3
    ports: ["5679:5678"]
    environment:
      N8N_SECURE_COOKIE: "false"
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-http://api:8000}
      CRM_SYNC_URL: ${CRM_SYNC_URL:-http://crm-stub:8090/sync}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set a local secret}
    volumes: [n8n-data:/home/node/.n8n]
volumes:
  ops-data:
  n8n-data:
